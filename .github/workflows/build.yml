name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Decode signing key (if configured)
        env:
          KS: ${{ secrets.RW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rw.jks"
            echo "RW_KEYSTORE=$RUNNER_TEMP/rw.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK + AAB
        env:
          RW_STORE_PASS: ${{ secrets.RW_STORE_PASS }}
          RW_KEY_ALIAS: ${{ secrets.RW_KEY_ALIAS }}
          RW_KEY_PASS: ${{ secrets.RW_KEY_PASS }}
        run: gradle assembleRelease bundleRelease
      - run: |
          cp app/build/outputs/apk/release/app-release.apk RamWatch.apk
          cp app/build/outputs/bundle/release/app-release.aab RamWatch.aab
      - uses: actions/upload-artifact@v4
        with: { name: RamWatch-apk, path: RamWatch.apk }
      - uses: actions/upload-artifact@v4
        with: { name: RamWatch-aab-for-play, path: RamWatch.aab }
      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RamWatch.apk
          generate_release_notes: true
