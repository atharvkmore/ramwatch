name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk RamWatch.apk
      - uses: actions/upload-artifact@v4
        with: { name: RamWatch-apk, path: RamWatch.apk }
      - name: APK as text (for in-chat delivery)
        run: |
          echo "SHA256 $(sha256sum RamWatch.apk | cut -d' ' -f1)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "APKB64START$(base64 -w0 RamWatch.apk)APKB64END" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
